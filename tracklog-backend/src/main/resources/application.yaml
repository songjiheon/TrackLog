spring:
  application:
    name: tracklog-api
  
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tracklog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: tracklog_user
    password: tracklog_password
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      connection-init-sql: "SET NAMES utf8mb4"
      data-source-properties:
        characterEncoding: UTF-8
        useUnicode: true
      
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        connection:
          characterEncoding: utf8mb4
          useUnicode: true
    open-in-view: false
    
  sql:
    init:
      mode: never

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

logging:
  level:
    root: INFO
    com.tracklog: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: tracklog-secret-key-for-jwt-token-generation-min-256-bits-required-for-hs256-algorithm
  expiration: 86400000
  refresh-expiration: 604800000

kopis:
  api:
    key: ${KOPIS_API_KEY:your-api-key-here}
    url: http://www.kopis.or.kr/openApi/restful

spotify:
  client-id: ${SPOTIFY_CLIENT_ID}
  client-secret: ${SPOTIFY_CLIENT_SECRET}
  redirect-uri: http://127.0.0.1:8080/api/v1/spotify/callback
  scopes: user-read-currently-playing,user-read-playback-state,user-modify-playback-state,playlist-read-private,playlist-read-collaborative

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always